name: Lint code

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Lint with all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@cargo-hack
      - name: Lint each feature in isolation
        run: cargo hack clippy --workspace --all-targets --each-feature --exclude-features _online,default,all -- -D warnings
      - name: Lint c-ffi bindings
        working-directory: ./bindings/c-ffi
        run: cargo clippy
      - name: Lint uniffi bindings
        working-directory: ./bindings/uniffi
        run: cargo clippy
      - name: check Cargo.lock files are up-to-date
        run: git diff --quiet || exit 1
